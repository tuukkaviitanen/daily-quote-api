[package]
name = "daily-quote-api"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["sqlite", "macros", "runtime-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"
rand = "0.9.2"
tokio = {version ="1.48.0", features = ["full"]}
poem = "3.1.12"
poem-openapi = {version = "5.1.16", features = ["swagger-ui"]}
